server {
  listen 8080;
  port_in_redirect off;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

  # Enforced CSP, validated in report-only mode against the search flow
  # (Chrome + Safari) before switching. No report-uri/report-to endpoint yet
  # (TODO), so violations after this point are only visible as breakage —
  # watch Sentry and the browser console after each deploy.
  set $csp "default-src 'self'; script-src 'self' https://cloud.umami.is; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://api.open-meteo.com https://nominatim.openstreetmap.org https://photon.komoot.io https://tiles.stadiamaps.com https://tiles.openfreemap.org https://cloud.umami.is https://gateway.umami.is https://o4511568346021888.ingest.de.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy $csp always;

  # The three Workers, relayed under the site's own domain: some corporate
  # filters block *.workers.dev hosts, and the page itself already gets
  # through. Variables in proxy_pass make nginx resolve the host per request,
  # so a DNS hiccup at boot can't keep the site from starting.
  resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
  proxy_http_version 1.1;
  proxy_ssl_server_name on;
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 3;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

  location = /api/route {
    set $worker ors-proxy.meridianway.workers.dev;
    proxy_pass https://$worker/;
    proxy_set_header Host $worker;
  }

  location = /api/overpass {
    set $worker overpass-cache.meridianway.workers.dev;
    proxy_pass https://$worker/;
    proxy_set_header Host $worker;
  }

  # This Worker limits requests per IP, and every relayed request comes from
  # this machine. Fly puts the visitor's IP in Fly-Client-IP; the shared
  # secret is what makes the Worker trust it. EDGE_SECRET is filled in at
  # container start (see Dockerfile).
  location = /api/buildings/ {
    set $worker swissbuildings-lookup.meridianway.workers.dev;
    proxy_pass https://$worker/$is_args$args;
    proxy_set_header Host $worker;
    proxy_set_header X-Client-IP $http_fly_client_ip;
    proxy_set_header X-Edge-Secret "${EDGE_SECRET}";
  }

  location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp always;
  }

  location / { try_files $uri $uri/ /index.html; }
}
