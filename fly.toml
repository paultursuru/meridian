# fly.toml app configuration file generated for meridian-way on 2026-05-24T16:34:27+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'meridian-way'
primary_region = 'lhr'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # One machine stays up: at a couple of visits a day, a stopped machine meant
  # nearly every visitor waited for it to boot.
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256
