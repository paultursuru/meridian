# Where each page's Markdown copy lives, and the way back: the two `Link`
# headers below. `index index.html` turns /about/ into /about/index.html
# internally, so both shapes are matched. Empty for anything that is not a
# page, and add_header skips a header whose value is empty.
map $uri $md_link {
  default                     "";
  "~^/(?:index\.html)?$"      "</index.md>; rel=\"alternate\"; type=\"text/markdown\"";
  "~^(.+?)/(?:index\.html)?$" "<$1.md>; rel=\"alternate\"; type=\"text/markdown\"";
}

map $uri $html_link {
  default              "";
  "/index.md"          "</>; rel=\"alternate\"; type=\"text/html\"";
  "~^(.+)\.md$"        "<$1/>; rel=\"alternate\"; type=\"text/html\"";
}

server {
  listen 8080;
  port_in_redirect off;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 256;
  gzip_types text/plain text/markdown text/css application/javascript application/json image/svg+xml font/woff2;

  # Enforced CSP, validated in report-only mode against the search flow
  # (Chrome + Safari) before switching. No report-uri/report-to endpoint yet
  # (TODO), so violations after this point are only visible as breakage —
  # watch Sentry and the browser console after each deploy.
  set $csp "default-src 'self'; script-src 'self' https://cloud.umami.is; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.stadiamaps.com; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://api.open-meteo.com https://nominatim.openstreetmap.org https://photon.komoot.io https://tiles.stadiamaps.com https://tiles.openfreemap.org https://cloud.umami.is https://gateway.umami.is https://o4511568346021888.ingest.de.sentry.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self';";

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy $csp always;

  # The three Workers, relayed under the site's own domain: some corporate
  # filters block *.workers.dev hosts, and the page itself already gets
  # through. Variables in proxy_pass make nginx resolve the host per request,
  # so a DNS hiccup at boot can't keep the site from starting.
  resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
  proxy_http_version 1.1;
  proxy_ssl_server_name on;
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 3;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

  location = /api/route {
    set $worker ors-proxy.meridianway.workers.dev;
    proxy_pass https://$worker/;
    proxy_set_header Host $worker;
  }

  location = /api/overpass {
    set $worker overpass-cache.meridianway.workers.dev;
    proxy_pass https://$worker/;
    proxy_set_header Host $worker;
  }

  # This Worker limits requests per IP, and every relayed request comes from
  # this machine. Fly puts the visitor's IP in Fly-Client-IP; the shared
  # secret is what makes the Worker trust it. EDGE_SECRET is filled in at
  # container start (see Dockerfile).
  location = /api/buildings/ {
    set $worker swissbuildings-lookup.meridianway.workers.dev;
    proxy_pass https://$worker/$is_args$args;
    proxy_set_header Host $worker;
    proxy_set_header X-Client-IP $http_fly_client_ip;
    proxy_set_header X-Edge-Secret "${EDGE_SECRET}";
  }

  location ~* \.(?:js|css|woff2?|ttf|png|jpg|jpeg|svg|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # The .md copies of the pages (astro-mark-don) and llms.txt, for LLMs.
  # mime.types has no .md entry: without this, nosniff makes browsers
  # download them. A missing .md is a 404, not the app. The charset goes
  # through charset_types: inside default_type it would keep gzip_types
  # from matching.
  location ~* \.md$ {
    default_type text/markdown;
    charset utf-8;
    charset_types text/markdown;
    add_header Link $html_link always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp always;
  }

  location = /llms.txt {
    charset utf-8;
  }

  # The whole site's text in one file, which we don't publish: the home page's
  # Markdown is the closest thing. A redirect, not a 301: shipping a real one
  # later shouldn't have to wait for caches to forget.
  location = /llms-full.txt {
    return 302 /index.md;
  }

  # A .txt, .json or .xml that doesn't exist is a 404, not the app. Agents
  # guess these paths (ard.json, llms-full.txt, ai.txt), and the catch-all
  # below would answer 200 with index.html every time.
  location ~* \.(?:txt|json|xml)$ {
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header Link $md_link always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp always;
  }

  # An agent asking for a manifest we don't publish must get a 404, not the
  # app's index.html parsed as JSON (PageSpeed's agentic check reads
  # /.well-known/ard.json).
  location /.well-known/ { try_files $uri =404; }

  # The 404 page. `internal` keeps /404.html from answering 200 on its own.
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }

  location / {
    try_files $uri $uri/ =404;
    add_header Link $md_link always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $csp always;
  }
}
